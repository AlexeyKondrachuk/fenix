name: Fenix VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the prepared VPS after building
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and publish to GHCR
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_YMAPS_API_KEY: ${{ vars.NEXT_PUBLIC_YMAPS_API_KEY }}
        run: |
          set -euo pipefail
          bash -n deploy/update.sh
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64 --push \
            --build-arg NEXT_PUBLIC_YMAPS_API_KEY \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image:$GITHUB_SHA" --metadata-file "$RUNNER_TEMP/fenix-image.json" .
          digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/fenix-image.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image=%s@%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"
          printf 'Image for Compose: `%s@%s`\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: fenix-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      FENIX_IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Update the prepared VPS
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set VPS_HOST}" "${VPS_USER:?Set VPS_USER}"
          : "${VPS_SSH_KEY:?Set VPS_SSH_KEY}" "${VPS_KNOWN_HOSTS:?Set VPS_KNOWN_HOSTS}"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FENIX_IMAGE" =~ ^ghcr\.io/[a-z0-9-]+/[a-z0-9._-]+@sha256:[0-9a-f]{64}$ ]]
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/fenix-key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/fenix-known-hosts"
          ssh -i "$RUNNER_TEMP/fenix-key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/fenix-known-hosts" \
            -o ConnectTimeout=15 -- "$VPS_USER@$VPS_HOST" \
            "cd ~/fenix && git fetch origin main && git merge-base --is-ancestor '$GITHUB_SHA' origin/main && git checkout --detach '$GITHUB_SHA' && bash deploy/update.sh '$FENIX_IMAGE'"
